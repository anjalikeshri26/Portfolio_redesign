name: Update portfolio stats
on:
  schedule: [{ cron: '0 */6 * * *' }]   # every 6 hours
  workflow_dispatch:                    # lets you run it manually
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-stats.mjs
      - name: Commit if changed
        run: |
          git config user.name "stats-bot"; git config user.email "stats-bot@users.noreply.github.com"
          git add public/stats.json
          git diff --cached --quiet || (git commit -m "chore: update stats" && git push)
